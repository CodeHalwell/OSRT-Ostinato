[project]
name = "osrt"
version = "0.7.0"
description = "OSRT — Optimized Sparse Recursive Transformer: a recursive sparse-MoE language model. Parameter counts are generated by scripts/compute_budget.py and deliberately not stated here."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeHalwell" }]

dependencies = [
    # Runtime of the model + trainer. Everything here is imported by src/osrt.
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "datasets>=2.18.0",
    "transformers>=4.39.0",
    "huggingface_hub>=0.35",
    "wandb>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osrt"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# `uv sync` installs these groups by default so the local checkout can lint,
# test and launch; the wheel itself depends only on the runtime list above.
default-groups = ["dev", "launch"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
# Launchers and optional optimizer paths: app.py / scripts/*.py (modal),
# optimizer_name="lion" (lion-pytorch), .env loading in train_main (dotenv).
launch = [
    "modal>=1.3.5",
    "lion-pytorch>=0.2.0",
    "python-dotenv>=1.0.0",
]
