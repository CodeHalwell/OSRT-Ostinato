<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style><![CDATA[
      svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .box { rx: 5; ry: 5; stroke-width: 1.2; }
      .lbl { font-size: 13.5px; fill: #0f172a; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #475569; }
      .inner-sub { font-size: 9.5px; fill: #475569; }
      .ttl { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .e { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arr); }
      
      /* Academic Color Palette */
      .io { fill: #f1f5f9; stroke: #475569; }
      .emb { fill: #e0e7ff; stroke: #4338ca; }
      .mhc { fill: #f3e8ff; stroke: #6b21a8; }
      .attn { fill: #eff6ff; stroke: #1d4ed8; }
      .moe { fill: #fff7ed; stroke: #c2410c; }
      .norm { fill: #f8fafc; stroke: #475569; }
      .head { fill: #ecfdf5; stroke: #047857; }
      .panel { fill: #fafafa; stroke: #cbd5e1; stroke-width: 1.2; }
      .h { font-size: 12px; font-weight: 700; fill: #0f172a; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="30" y="36" class="ttl">OSRT — Optimized Sparse Recursive Transformer</text>
  <text x="30" y="58" class="sub">601M physical · 278M active/token · recursive MoE · GQA + KDV · mHC residual · Muon optimizer</text>

  <!-- MAIN FLOW (center column x≈330) -->
  <rect class="box io" x="230" y="80" width="220" height="36"/>
  <text x="340" y="103" text-anchor="middle" class="lbl">input_ids  (B, S)</text>
  <line class="e" x1="340" y1="116" x2="340" y2="140"/>

  <rect class="box emb" x="210" y="140" width="260" height="40"/>
  <text x="340" y="160" text-anchor="middle" class="lbl">token embedding</text>
  <text x="340" y="174" text-anchor="middle" class="sub">65,536 × 1536  (tied to LM head)</text>
  <line class="e" x1="340" y1="180" x2="340" y2="204"/>

  <rect class="box mhc" x="210" y="204" width="260" height="36"/>
  <text x="340" y="227" text-anchor="middle" class="lbl">mHC: init 4 residual streams</text>
  <line class="e" x1="340" y1="240" x2="340" y2="266"/>

  <!-- recursive backbone -->
  <rect x="150" y="266" width="380" height="226" rx="14" fill="rgba(124, 58, 237, 0.01)" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="340" y="290" text-anchor="middle" class="h" fill="#7c3aed">Recursive backbone</text>
  <text x="340" y="306" text-anchor="middle" class="sub">3 physical blocks × 6 loops = 18 effective layers  (diagram 05)</text>

  <!-- one block depiction inside (widened to 350, centered at 340) -->
  <rect class="box attn" x="165" y="320" width="350" height="54"/>
  <text x="340" y="340" text-anchor="middle" class="lbl">Attention sub-block → mHC.update</text>
  <text x="340" y="356" text-anchor="middle" class="inner-sub">GQA 24/8 · KDV (Key-Derived Value) Latent Cache · QK-Norm · RoPE · +HRA</text>
  <line class="e" x1="340" y1="374" x2="340" y2="392"/>
  
  <rect class="box moe" x="165" y="392" width="350" height="54"/>
  <text x="340" y="412" text-anchor="middle" class="lbl">MoE sub-block → mHC.update</text>
  <text x="340" y="428" text-anchor="middle" class="inner-sub">1 Shared + 8 Routed, top-2 · Grouped-GEMM · Aux-Free Balance</text>

  <text x="498" y="462" text-anchor="end" class="h" fill="#7c3aed">↺ ×6 loops</text>
  <text x="500" y="478" text-anchor="end" class="sub" fill="#6b21a8">(+ loop embedding per iteration)</text>

  <line class="e" x1="340" y1="492" x2="340" y2="516"/>

  <!-- collapse + norm -->
  <rect class="box mhc" x="210" y="516" width="260" height="36"/>
  <text x="340" y="539" text-anchor="middle" class="lbl">mHC collapse  (4 → 1)</text>
  <line class="e" x1="340" y1="552" x2="340" y2="576"/>
  
  <rect class="box norm" x="210" y="576" width="260" height="36"/>
  <text x="340" y="599" text-anchor="middle" class="lbl">RMSNorm (norm_out)</text>
  <line class="e" x1="340" y1="612" x2="340" y2="636"/>

  <!-- heads -->
  <rect class="box head" x="180" y="636" width="200" height="44"/>
  <text x="280" y="657" text-anchor="middle" class="lbl">tied LM head</text>
  <text x="280" y="672" text-anchor="middle" class="sub">→ logits (B,S,65536)</text>
  
  <rect class="box head" x="400" y="636" width="150" height="44" opacity="0.75"/>
  <text x="475" y="657" text-anchor="middle" class="lbl">2 MTP heads</text>
  <text x="475" y="672" text-anchor="middle" class="sub">train-only</text>
  
  <line class="e" x1="340" y1="636" x2="300" y2="636"/>
  <line class="e" x1="380" y1="614" x2="460" y2="636" stroke-dasharray="4 3"/>

  <!-- SIDE PANEL: specs -->
  <rect class="panel" x="590" y="80" width="340" height="330" rx="10"/>
  <text x="610" y="104" class="h">Architecture</text>
  <text x="610" y="126" class="sub">• dim 1536 · head_dim 64 · 24 q / 8 kv heads (GQA)</text>
  <text x="610" y="144" class="sub">• MLA-lite KDV (Key-Derived Value): cache one 512-d latent</text>
  <text x="610" y="162" class="sub">• MoE: 1 shared (h=2816) + 8 routed (h=3840), top-2</text>
  <text x="610" y="180" class="sub">• routed experts ≈ 71% of params (424.7M)</text>
  <text x="610" y="198" class="sub">• mHC: 4 streams, log-domain Sinkhorn mixing</text>
  <text x="610" y="216" class="sub">• HRA adapters rank 256 (18, attention path)</text>
  <text x="610" y="234" class="sub">• flash SDPA (attention sink dropped)</text>

  <text x="610" y="266" class="h">Training</text>
  <text x="610" y="288" class="sub">• Muon (matrices) + AdamW (rest) · cosine LR</text>
  <text x="610" y="306" class="sub">• bf16 · gradient checkpointing · fused linear-CE</text>
  <text x="610" y="324" class="sub">• torch.compile fullgraph (grouped-GEMM, no breaks)</text>
  <text x="610" y="342" class="sub">• seq curriculum 2048 → 4096 → 8192</text>
  <text x="610" y="360" class="sub">• data: FineWeb-Edu + Nemotron math/code/STEM</text>
  <text x="610" y="378" class="sub">  + Cosmopedia (math-first)</text>
  <text x="610" y="396" class="sub">• collapse telemetry: loop ‖Δx‖/‖x‖, dead-experts</text>

  <!-- pipeline panel -->
  <rect class="panel" x="590" y="430" width="340" height="120" rx="10"/>
  <text x="610" y="454" class="h">Pipeline</text>
  <text x="610" y="476" class="sub">1. Pretrain  (this model)</text>
  <text x="610" y="494" class="sub">2. Mid-training / extend  (HRA + math, re-warm)</text>
  <text x="610" y="512" class="sub">3. SFT  →  multi-teacher distillation (MOPD)</text>
  <text x="610" y="530" class="sub">4. GRPO  (RL with verifiable rewards)</text>

  <!-- legend -->
  <rect class="panel" x="590" y="570" width="340" height="110" rx="10"/>
  <text x="610" y="592" class="h">Legend</text>
  
  <rect class="box emb" x="610" y="602" width="18" height="14" rx="3"/><text x="634" y="614" class="sub">embedding / heads</text>
  <rect class="box attn" x="610" y="622" width="18" height="14" rx="3"/><text x="634" y="634" class="sub">attention</text>
  <rect class="box moe" x="760" y="602" width="18" height="14" rx="3"/><text x="784" y="614" class="sub">MoE</text>
  <rect class="box mhc" x="760" y="622" width="18" height="14" rx="3"/><text x="784" y="634" class="sub">mHC residual</text>
  
  <text x="610" y="654" class="sub" font-style="italic">Diagrams: 01 attention · 02 MoE · 03 mHC</text>
  <text x="610" y="668" class="sub" font-style="italic">04 block · 05 recursion · 06 full</text>
</svg>
