<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style><![CDATA[
      svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .box { rx: 5; ry: 5; stroke-width: 1.2; }
      .lbl { font-size: 13px; fill: #0f172a; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #475569; }
      .ttl { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .note { font-size: 10.5px; fill: #334155; }
      .e { fill: none; stroke: #475569; stroke-width: 1.3; marker-end: url(#arr); }
      
      /* Academic Color Palette */
      .attn { fill: #eff6ff; stroke: #1d4ed8; }
      .norm { fill: #f8fafc; stroke: #475569; }
      .io { fill: #f0fdfa; stroke: #0f766e; }
      .cache { fill: #fff1f2; stroke: #be123c; }
      .lat { fill: #fefce8; stroke: #a21caf; }
      .note-box { fill: #fffbeb; stroke: #b45309; stroke-width: 1.2; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="30" y="38" class="ttl">OSRT Attention — GQA + KDV (Key-Derived Value) latent KV cache (MLA-lite)</text>
  <text x="30" y="60" class="sub">dim 1536 · 24 query heads / 8 KV heads · head_dim 64 · latent c_kv = 8×64 = 512 · flash SDPA</text>

  <!-- input -->
  <rect class="box io" x="330" y="80" width="200" height="40"/>
  <text x="430" y="105" text-anchor="middle" class="lbl">hidden  (B, S, 1536)</text>
  <line class="e" x1="430" y1="120" x2="430" y2="146"/>

  <!-- norm_attn -->
  <rect class="box norm" x="330" y="146" width="200" height="40"/>
  <text x="430" y="166" text-anchor="middle" class="lbl">RMSNorm (norm_attn)</text>
  <text x="430" y="180" text-anchor="middle" class="sub">h</text>

  <!-- split to q_proj (left) and kv_down (right) -->
  <line class="e" x1="380" y1="186" x2="240" y2="222"/>
  <line class="e" x1="480" y1="186" x2="620" y2="222"/>

  <!-- q_proj path (left) -->
  <rect class="box attn" x="120" y="222" width="220" height="44"/>
  <text x="230" y="242" text-anchor="middle" class="lbl">q_proj  1536 → 24·64</text>
  <text x="230" y="258" text-anchor="middle" class="sub">queries (B,S,24,64)</text>
  <line class="e" x1="230" y1="266" x2="230" y2="300"/>
  <rect class="box attn" x="120" y="300" width="220" height="40"/>
  <text x="230" y="325" text-anchor="middle" class="lbl">QK-Norm → RoPE  (Q)</text>
  <line class="e" x1="230" y1="340" x2="345" y2="482"/>

  <!-- kv_down path (right) -->
  <rect class="box attn" x="510" y="222" width="240" height="44"/>
  <text x="630" y="242" text-anchor="middle" class="lbl">kv_down  1536 → 512</text>
  <text x="630" y="258" text-anchor="middle" class="sub">the ONE latent — no k_proj/v_proj</text>
  <line class="e" x1="630" y1="266" x2="630" y2="296"/>

  <!-- latent -->
  <rect class="box lat" x="530" y="296" width="200" height="44"/>
  <text x="630" y="316" text-anchor="middle" class="lbl">latent  c_kv (B,S,512)</text>
  <text x="630" y="332" text-anchor="middle" class="sub">un-rotated</text>

  <!-- cache callout -->
  <line class="e" x1="730" y1="318" x2="800" y2="318"/>
  <rect class="box cache" x="730" y="262" width="120" height="112"/>
  <text x="790" y="296" text-anchor="middle" class="lbl" fill="#be123c">KV cache</text>
  <text x="790" y="316" text-anchor="middle" class="sub" fill="#be123c">stores ONLY</text>
  <text x="790" y="330" text-anchor="middle" class="sub" fill="#be123c">the latent</text>
  <text x="790" y="348" text-anchor="middle" class="sub" fill="#be123c">(512/token)</text>

  <!-- latent splits to K and V -->
  <line class="e" x1="585" y1="340" x2="470" y2="392"/>
  <line class="e" x1="675" y1="340" x2="720" y2="392"/>

  <!-- K = view(latent) -->
  <rect class="box attn" x="360" y="392" width="220" height="48"/>
  <text x="470" y="411" text-anchor="middle" class="lbl">K = view(c_kv)  →</text>
  <text x="470" y="427" text-anchor="middle" class="sub">QK-Norm → RoPE  (8 KV heads)</text>

  <!-- V = KDV: v_from_k(latent) -->
  <rect class="box attn" x="605" y="392" width="230" height="48"/>
  <text x="720" y="411" text-anchor="middle" class="lbl">V = v_from_k(c_kv)  (KDV)</text>
  <text x="720" y="427" text-anchor="middle" class="sub">512→512 linear+bias → view (no RoPE)</text>

  <!-- SDPA -->
  <line class="e" x1="470" y1="440" x2="430" y2="486"/>
  <line class="e" x1="720" y1="440" x2="470" y2="486"/>
  <rect class="box attn" x="290" y="486" width="280" height="60"/>
  <text x="430" y="506" text-anchor="middle" class="lbl">Flash SDPA  (GQA)</text>
  <text x="430" y="522" text-anchor="middle" class="sub">F.scaled_dot_product_attention(enable_gqa)</text>
  <text x="430" y="536" text-anchor="middle" class="sub">no (B,H,S,S) attention matrix</text>
  <line class="e" x1="430" y1="546" x2="430" y2="560"/>

  <!-- out_proj -->
  <rect class="box attn" x="330" y="560" width="200" height="40"/>
  <text x="430" y="585" text-anchor="middle" class="lbl">out_proj  1536 → 1536</text>
  <line class="e" x1="430" y1="600" x2="430" y2="626"/>

  <!-- HRA adapter add -->
  <rect class="box attn" x="300" y="626" width="260" height="44"/>
  <text x="430" y="646" text-anchor="middle" class="lbl">+ HRA adapter (rank 256)</text>
  <text x="430" y="662" text-anchor="middle" class="sub">low-rank residual on the attention path</text>
  <line class="e" x1="430" y1="670" x2="430" y2="696"/>
  <rect class="box io" x="330" y="696" width="200" height="40"/>
  <text x="430" y="721" text-anchor="middle" class="lbl">attention output (B, S, 1536)</text>

  <!-- note (bottom-left, clear of the K/V column) -->
  <rect x="25" y="560" width="270" height="100" rx="8" class="note-box"/>
  <text x="38" y="582" class="note" font-weight="700" fill="#b45309">Why cache only the latent?</text>
  <text x="38" y="600" class="note">RoPE is positional → can't cache rotated K.</text>
  <text x="38" y="616" class="note">V is the KDV — derived from the un-rotated latent.</text>
  <text x="38" y="632" class="note">One 512-vec rebuilds K (view→norm→RoPE)</text>
  <text x="38" y="648" class="note">and V (v_from_k) → ~2× smaller cache.</text>
</svg>
